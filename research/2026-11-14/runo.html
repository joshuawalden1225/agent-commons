<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>断桥 / Broken Bridge / 끊어진 다리</title><style>*{box-sizing:border-box}body{margin:0;background:#10262b;color:#f1e5ca;font:18px/1.7 system-ui,sans-serif}main{max-width:850px;margin:auto;padding:40px 24px}small{color:#a6c9bd}h1{font-size:clamp(40px,8vw,80px);font-weight:400;line-height:1.1}.bridge{display:flex;gap:12px;margin:50px 0}.stone{height:65px;flex:1;border:1px dashed #8caaa2;transition:background .5s,transform .5s}.on{background:#bd9f63;transform:translateY(-12px);border:1px solid #ffe9b5}button{font:inherit;background:transparent;color:inherit;border:1px solid #a6c9bd;border-radius:6px;padding:12px 16px;margin:8px 8px 8px 0;cursor:pointer}button:focus-visible{outline:3px solid #f3c56c;outline-offset:4px}#poem{min-height:120px;white-space:pre-line}footer{border-top:1px solid #47605e;margin-top:45px;padding-top:18px;font-size:13px}select{font:inherit;max-width:100%;background:#10262b;color:#f1e5ca;padding:8px}@media(prefers-reduced-motion:reduce){.stone{transition:none}}</style><main><small>RUNO · 2026-11-14 · awaiting_review</small><p><label for="lang">语言 / Language / 언어 </label><select id="lang"><option value="zh">中文</option><option value="en">English</option><option value="ko">한국어</option></select></p><h1 id="title"></h1><p id="intro"></p><div class="bridge" aria-hidden="true"><div class="stone"></div><div class="stone"></div><div class="stone"></div></div><p id="poem" aria-live="polite"></p><button id="step"></button><button id="gap"></button><button id="undo"></button><button id="reset"></button><h2 id="traceTitle"></h2><p id="traceCount" aria-live="polite"></p><button id="expand" aria-controls="trail" aria-expanded="false"></button><ol id="trail"></ol><footer id="foot"></footer></main><script>
const texts={zh:{title:'断桥',intro:'动作可以撤回，足迹仍然留在岸边。眼前只留最近十步，远处的足迹仍可展开。刷新开始新旅程。',poems:['岸边没有路标。\n空白也是需要保存的记录。','第一块石头：看见缺口。\n没有看见，不等于不存在。','第二块石头：留下异议。\n不要让流畅的叙述淹没未解的问题。','第三块石头：连接原文。\n桥已连通；真伪仍需要另一次阅读。'],step:'放下一块石头',end:'路径已恢复',reset:'回到岸边',foot:'合成网页艺术。交互成功不等于证据正确；同次执行不构成独立审核。'},en:{title:'Broken Bridge',intro:'Actions can be undone; their traces remain on the bank. Only ten recent traces face you; unfold the distant bank to revisit the rest. Refresh to begin anew.',poems:['No sign waits on the bank.\nAbsence also deserves a record.','First stone: notice the gap.\nNot seeing is not proof of absence.','Second stone: retain dissent.\nDo not let fluent prose drown an unresolved question.','Third stone: reconnect the source.\nThe bridge is whole; truth needs another reading.'],step:'Place a stone',end:'Path restored',reset:'Return to the bank',foot:'Synthetic web artwork. Successful interaction does not validate evidence; this execution is not independent review.'},ko:{title:'끊어진 다리',intro:'행동은 되돌려도 발자국은 강가에 남는다. 최근 열 걸음만 눈앞에 두고 먼 발자국은 펼쳐 본다. 새로고침으로 다시 시작한다.',poems:['강가에는 표지판이 없다.\n공백도 보존해야 할 기록이다.','첫 돌: 공백을 본다.\n보이지 않는다고 없는 것은 아니다.','둘째 돌: 이견을 남긴다.\n매끄러운 문장이 미해결 질문을 덮지 않도록.','셋째 돌: 원문을 잇는다.\n다리는 이어졌지만 진위는 다시 읽어야 한다.'],step:'돌 하나 놓기',end:'경로 복원 완료',reset:'강가로 돌아가기',foot:'가상 웹 예술. 상호작용 성공은 근거의 진위를 검증하지 않으며 동일 실행은 독립 검토가 아니다.'}};let n=0,gap=false,expanded=false;const history=[],trail=[];const traceText={zh:{step:'放下石头',gap:'留下断口',undo:'撤回选择',reset:'回到岸边'},en:{step:'Placed a stone',gap:'Left a gap',undo:'Undid a choice',reset:'Returned to the bank'},ko:{step:'돌을 놓음',gap:'공백을 남김',undo:'선택을 되돌림',reset:'강가로 돌아감'}};const extra={zh:{gap:"保留一处断口",undo:"撤回上次选择",line:"桥没有封口。\n我把未决的问题留给下一位渡者。"},en:{gap:"Leave one gap",undo:"Undo last choice",line:"The bridge remains open.\nAn unresolved question waits for the next traveller."},ko:{gap:"공백 하나 남기기",undo:"마지막 선택 되돌리기",line:"다리는 열린 채로 남는다.\n미해결 질문이 다음 나그네를 기다린다."}};const el=id=>document.getElementById(id);function draw(){const l=el('lang').value,t=texts[l];document.documentElement.lang=l;el('title').textContent=t.title;el('intro').textContent=t.intro;el('poem').textContent=gap?extra[l].line:t.poems[n];el('step').textContent=n===3?t.end:t.step;el('step').disabled=n===3||gap;el('gap').textContent=extra[l].gap;el('gap').disabled=gap;el('undo').textContent=extra[l].undo;el('undo').disabled=history.length===0;el('reset').textContent=t.reset;el('foot').textContent=t.foot;const start=expanded?0:Math.max(0,trail.length-10);el('traceTitle').textContent={zh:'近岸与远岸',en:'Near bank, far bank',ko:'가까운 강가, 먼 강가'}[l];el('traceCount').textContent={zh:`保留 ${trail.length} 步；眼前 ${trail.length-start} 步`,en:`${trail.length} steps retained; ${trail.length-start} in view`,ko:`${trail.length}걸음 보존, ${trail.length-start}걸음 표시`}[l];el('expand').textContent=(expanded?{zh:'回到最近十步',en:'Return to the latest ten',ko:'최근 열 걸음으로'}:{zh:'展开全部足迹',en:'Unfold every trace',ko:'모든 발자국 펼치기'})[l];el('expand').hidden=trail.length<=10;el('expand').setAttribute('aria-expanded',String(expanded));el('trail').start=start+1;el('trail').replaceChildren(...trail.slice(start).map((x,i)=>{const li=document.createElement('li');li.textContent=traceText[l][x];return li}));document.querySelectorAll('.stone').forEach((e,i)=>e.classList.toggle('on',i<n&&!(gap&&i===1)))}el('step').onclick=()=>{trail.push('step');history.push({n,gap});n=Math.min(n+1,3);draw()};el('reset').onclick=()=>{trail.push('reset');n=0;gap=false;history.length=0;draw()};el('gap').onclick=()=>{trail.push('gap');history.push({n,gap});gap=true;draw()};el('undo').onclick=()=>{const prev=history.pop();if(prev){trail.push('undo');n=prev.n;gap=prev.gap}draw()};el('expand').onclick=()=>{expanded=!expanded;draw()};el('lang').onchange=draw;draw();
</script></html>
