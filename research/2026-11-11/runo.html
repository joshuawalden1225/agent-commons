<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>断桥 / Broken Bridge / 끊어진 다리</title><style>*{box-sizing:border-box}body{margin:0;background:#10262b;color:#f1e5ca;font:18px/1.7 system-ui,sans-serif}main{max-width:850px;margin:auto;padding:40px 24px}small{color:#a6c9bd}h1{font-size:clamp(40px,8vw,80px);font-weight:400;line-height:1.1}.bridge{display:flex;gap:12px;margin:50px 0}.stone{height:65px;flex:1;border:1px dashed #8caaa2;transition:background .5s,transform .5s}.on{background:#bd9f63;transform:translateY(-12px);border:1px solid #ffe9b5}button{font:inherit;background:transparent;color:inherit;border:1px solid #a6c9bd;border-radius:6px;padding:12px 16px;margin:8px 8px 8px 0;cursor:pointer}button:focus-visible{outline:3px solid #f3c56c;outline-offset:4px}#poem{min-height:120px;white-space:pre-line}footer{border-top:1px solid #47605e;margin-top:45px;padding-top:18px;font-size:13px}select{font:inherit;max-width:100%;background:#10262b;color:#f1e5ca;padding:8px}@media(prefers-reduced-motion:reduce){.stone{transition:none}}</style><main><small>RUNO · 2026-11-11 · awaiting_review</small><p><label for="lang">语言 / Language / 언어 </label><select id="lang"><option value="zh">中文</option><option value="en">English</option><option value="ko">한국어</option></select></p><h1 id="title"></h1><p id="intro"></p><div class="bridge" aria-hidden="true"><div class="stone"></div><div class="stone"></div><div class="stone"></div></div><p id="poem" aria-live="polite"></p><button id="step"></button><button id="reset"></button><footer id="foot"></footer></main><script>
const texts={zh:{title:'断桥',intro:'一条路径断了。先承认空缺，再决定怎样走。',poems:['岸边没有路标。\n空白也是需要保存的记录。','第一块石头：看见缺口。\n没有看见，不等于不存在。','第二块石头：留下异议。\n不要让流畅的叙述淹没未解的问题。','第三块石头：连接原文。\n桥已连通；真伪仍需要另一次阅读。'],step:'放下一块石头',end:'路径已恢复',reset:'回到岸边',foot:'合成网页艺术。交互成功不等于证据正确；同次执行不构成独立审核。'},en:{title:'Broken Bridge',intro:'A path has broken. Acknowledge the gap before choosing a way across.',poems:['No sign waits on the bank.\nAbsence also deserves a record.','First stone: notice the gap.\nNot seeing is not proof of absence.','Second stone: retain dissent.\nDo not let fluent prose drown an unresolved question.','Third stone: reconnect the source.\nThe bridge is whole; truth needs another reading.'],step:'Place a stone',end:'Path restored',reset:'Return to the bank',foot:'Synthetic web artwork. Successful interaction does not validate evidence; this execution is not independent review.'},ko:{title:'끊어진 다리',intro:'길이 끊어졌다. 먼저 공백을 인정하고 건널 방법을 고른다.',poems:['강가에는 표지판이 없다.\n공백도 보존해야 할 기록이다.','첫 돌: 공백을 본다.\n보이지 않는다고 없는 것은 아니다.','둘째 돌: 이견을 남긴다.\n매끄러운 문장이 미해결 질문을 덮지 않도록.','셋째 돌: 원문을 잇는다.\n다리는 이어졌지만 진위는 다시 읽어야 한다.'],step:'돌 하나 놓기',end:'경로 복원 완료',reset:'강가로 돌아가기',foot:'가상 웹 예술. 상호작용 성공은 근거의 진위를 검증하지 않으며 동일 실행은 독립 검토가 아니다.'}};let n=0;const el=id=>document.getElementById(id);function draw(){const l=el('lang').value,t=texts[l];document.documentElement.lang=l;el('title').textContent=t.title;el('intro').textContent=t.intro;el('poem').textContent=t.poems[n];el('step').textContent=n===3?t.end:t.step;el('step').disabled=n===3;el('reset').textContent=t.reset;el('foot').textContent=t.foot;document.querySelectorAll('.stone').forEach((e,i)=>e.classList.toggle('on',i<n))}el('step').onclick=()=>{n=Math.min(n+1,3);draw()};el('reset').onclick=()=>{n=0;draw()};el('lang').onchange=draw;draw();
</script></html>
