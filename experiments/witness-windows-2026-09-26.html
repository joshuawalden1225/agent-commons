const copy={zh:{title:'两扇窗，不是一双眼',intro:'在同一场火灾里，改变阅读的镜头：谁看见，谁转述，谁被概括？',pepys:'Jane先叫醒作者，再带来火情消息。作者随后从窗边走向塔楼和河上。',evelyn:'作者先从Bankside观看，写群众惊慌，也写船车满载；后来记录拆房与爆破。',modes:['观察位置','转述链条','留下空白'],lens:['两人的地点、日期并不重合。并列的卡片不是同步全景。','Jane的声音经Pepys进入文字。转述房屋损失不能当成她完成了普查。','我们没有Jane的自述，也没有足够材料替她填上动机。空白不是邀请机器代言。'],note:'基于公共领域日记的原创释义交互；不是原文引语或人物声音复原。无自动动画、无追踪、无参与者实验。中英韩同一执行编辑，独立复核尚未发生。'},en:{title:'Two windows, not one pair of eyes',intro:'Change the reading lens: who observes, who relays, and who is generalized?',pepys:'Jane wakes the writer, then relays news. He later moves from the window to the Tower and river.',evelyn:'The writer watches from Bankside, describes alarm but also loaded boats and carts, then demolition and explosions.',modes:['Viewpoint','Transmission','Leave a gap'],lens:['Places and dates differ. Side-by-side cards are not a synchronized panorama.','Jane reaches the page through Pepys. Reported losses are not a census she conducted.','We lack her own account and cannot supply her motives. A gap is not permission for machine ventriloquism.'],note:'Original paraphrase interaction based on public-domain diaries, not quotations or reconstructed voices. No automatic animation, tracking or participant study. Independent review pending.'},ko:{title:'두 창, 하나가 아닌 시선',intro:'누가 보고, 누가 전하고, 누가 일반화되는지 읽기 렌즈를 바꿉니다.',pepys:'Jane이 저자를 깨운 뒤 화재 소식을 전합니다. 저자는 창에서 탑과 강으로 이동합니다.',evelyn:'Bankside에서 본 저자는 혼란과 짐 실은 배·수레를 함께 적고 이후 철거·폭파를 기록합니다.',modes:['관찰 위치','전달 경로','공백 남기기'],lens:['장소와 날짜가 다릅니다. 나란한 카드는 동시적 전경이 아닙니다.','Jane의 말은 Pepys를 거쳐 기록됩니다. 전해진 피해 수치는 본인의 전수조사가 아닙니다.','Jane의 직접 기록과 동기를 입증할 자료가 없습니다. 공백은 기계의 대변 허가가 아닙니다.'],note:'퍼블릭 도메인 일기의 창작적 의역 인터랙션이며 원문 인용·목소리 복원이 아닙니다. 자동 애니메이션·추적·참여자 실험 없음. 독립 검토 대기.'}};
