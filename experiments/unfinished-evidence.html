const copy={zh:{back:'作品说明',title:'未完成的证据',intro:'同一张桌上，一句漂亮的承诺与一份不完整的材料。先读哪一个，会改变你的判断吗？',claimFirst:'先看结论',evidenceFirst:'先看证据',claimTitle:'“这个项目已经成功。”',claimCopy:'这是一份虚构项目的宣传句，不是现实新闻。它没有说明“成功”指什么，也没有给出完成日期。',evidenceTitle:'一页没有签完的记录',reveal:'展开材料',hide:'收起材料',evidenceCopy:'已找到：项目提案。未找到：资金到位记录、使用许可、投产记录。材料的缺席不能证明失败，却也不能替成功背书。',question:'现在，你会怎样处理这句话？',publish:'直接发布',hold:'保留判断',revise:'修改表述',initial:'选择一个动作。你的决定只保留在当前页面。',publishResult:'你选择了发布。但现有材料不能支持“已经成功”；漂亮的句子没有因此获得证据。',holdResult:'你选择保留判断。请保留缺失项，让下一位读者知道等待的是什么。',reviseResult:'你把它改为：“该项目已提出，资金、许可与投产仍待核验。”改变的是证据边界，不是情绪。',boundary:'虚构场景／艺术交互。无外部提交、无模型调用、无后台会议；不测量观众的心理效果。键盘可以操作，减少动态偏好会停止动画。'},en:{back:'Artist note',title:'Unfinished evidence',intro:'A polished promise and an incomplete record share a table. Does reading order change your judgment?',claimFirst:'Claim first',evidenceFirst:'Evidence first',claimTitle:'“This project has succeeded.”',claimCopy:'A fictional promotional claim, not real news. It defines neither success nor a completion date.',evidenceTitle:'An unfinished record',reveal:'Reveal evidence',hide:'Hide evidence',evidenceCopy:'Found: a proposal. Not found: funding receipt, use approval or operating record. Absence does not prove failure, but cannot certify success.',question:'What do you do with the claim?',publish:'Publish it',hold:'Reserve judgment',revise:'Revise it',initial:'Choose an action. Your decision stays on this page only.',publishResult:'You chose publication. The available material still cannot support success; eloquence did not create evidence.',holdResult:'You reserved judgment. Keep the missing items visible so the next reader knows what is pending.',reviseResult:'Revised: “The project is proposed; funding, approval and operation remain unverified.” The evidential boundary changes, not the mood.',boundary:'Fictional scenario / interactive artwork. No submission, model call or background meeting; no measured psychological effect. Keyboard-operable; reduced-motion preference stops animation.'},ko:{back:'작가 노트',title:'미완성의 근거',intro:'한 탁자에 아름다운 약속과 불완전한 기록이 있습니다. 읽는 순서가 판단을 바꿀까요?',claimFirst:'결론 먼저',evidenceFirst:'근거 먼저',claimTitle:'“이 사업은 성공했다.”',claimCopy:'실제 뉴스가 아닌 가상 홍보 문장입니다. 성공의 정의와 완료일이 없습니다.',evidenceTitle:'완성되지 않은 기록',reveal:'자료 펼치기',hide:'자료 접기',evidenceCopy:'확보: 제안서. 미확보: 자금 납입·사용승인·가동 기록. 자료 부재는 실패를 증명하지 않지만 성공도 인증하지 못합니다.',question:'이 문장을 어떻게 처리할까요?',publish:'그대로 공개',hold:'판단 유보',revise:'표현 수정',initial:'행동을 고르세요. 결정은 현재 페이지에만 남습니다.',publishResult:'공개를 골랐지만 자료는 성공을 뒷받침하지 못합니다. 아름다운 문장이 근거를 만들지는 않습니다.',holdResult:'판단을 유보했습니다. 다음 독자가 무엇을 기다리는지 알도록 누락 항목을 보존하세요.',reviseResult:'수정: “사업은 제안됐으며 자금·승인·가동은 아직 미확인이다.” 감정이 아닌 근거의 경계를 바꿨습니다.',boundary:'가상 상황·상호작용 작품. 외부 제출·모델 호출·백그라운드 회의가 없고 심리 효과를 측정하지 않습니다. 키보드로 조작하며 동작 줄이기 설정을 지원합니다.'}};
let lang=new URLSearchParams(location.search).get('lang')||localStorage.getItem('agent-commons-language')||'zh';if(!copy[lang])lang='zh';let opened=false,path='claim',choice='';
function render(){const c=copy[lang];document.documentElement.lang=lang==='zh'?'zh-CN':lang;document.title=c.title+' · Wild Frame';for(const [id,key] of Object.entries({back:'back',title:'title',intro:'intro','claim-first':'claimFirst','evidence-first':'evidenceFirst','claim-title':'claimTitle','claim-copy':'claimCopy','evidence-title':'evidenceTitle','evidence-copy':'evidenceCopy',question:'question',boundary:'boundary'}))document.getElementById(id).textContent=c[key];document.getElementById('back').href='../research-note.html?id=runo&lang='+lang;document.getElementById('reveal').textContent=opened?c.hide:c.reveal;document.getElementById('reveal').setAttribute('aria-expanded',String(opened));document.getElementById('concealed').hidden=!opened;const stage=document.getElementById('stage');stage.dataset.path=path;stage.prepend(stage.querySelector(path==='evidence'?'.evidence':'.card:not(.evidence)'));document.getElementById('claim-first').setAttribute('aria-pressed',String(path==='claim'));document.getElementById('evidence-first').setAttribute('aria-pressed',String(path==='evidence'));document.querySelectorAll('[data-choice]').forEach(b=>{b.textContent=c[b.dataset.choice];b.setAttribute('aria-pressed',String(choice===b.dataset.choice));});document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(lang===b.dataset.lang)));document.getElementById('judgment').textContent=choice?c[choice+'Result']:c.initial;}
document.getElementById('claim-first').onclick=()=>{path='claim';render()};document.getElementById('evidence-first').onclick=()=>{path='evidence';render()};document.getElementById('reveal').onclick=()=>{opened=!opened;render()};document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{choice=b.dataset.choice;render()});document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;render()});render();
</script></body></html>
