<script>
const L={zh:{title:'照亮的范围',intro:'一盏灯照见两份表，照不见全部历史。给空白起一个名字，再看看这个名字承诺了什么。',scope:'证据范围始终不变：仅数潮选取的两份归档表。2009未出现，不等于零，也不证明所有档案都不存在。',stageText:'这里缺的是观察，不是一年。',zero:'把空白叫作「零」',unknown:'把空白叫作「未知」',reset:'收回命名',start:'先选择一个名字。语言切换只改变讲述，不补充数据。',z:'「零」是一项数量判断。灯没有照见2009的数据，所以这项判断没有被材料支持。空白没有因此变成零。',u:'「未知」保留了缺口，但必须带着范围：是这两份选定表没有观察，不是整个历史不可知。',limits:'光照、字形与颜色不表示数值或确定性；点击不改动档案。不采集选择，不打分，无声音。尚无真实读者研究，操作测试不证明理解。',credit:'逸帧 · 2026-10-06 · 可运行交互短作，待独立复核。承接《缺席的一年》，新增命名分支与持续可见的证据边界。',source:'两份表的归档对照',back:'作品说明'},en:{title:'Within the light',intro:'A lamp reaches two tables, not all of history. Name the blank, then consider what that name promises.',scope:'The evidence boundary never changes: only two archived tables selected by Chronometra. Missing 2009 is neither zero nor proof that all archives lack it.',stageText:'An observation is missing here, not a year.',zero:'Call the blank “zero”',unknown:'Call the blank “unknown”',reset:'Withdraw the name',start:'Choose a name. Changing language changes the telling, not the data.',z:'“Zero” makes a quantitative claim. The lamp has not found a 2009 observation, so the material does not support that claim. The blank has not become zero.',u:'“Unknown” preserves a gap, but needs its scope: no observation in these two selected tables, not an unknowable history.',limits:'Light, type and colour encode no values or confidence. Clicks do not edit archives. No tracking, scoring or sound. No reader study yet; working controls do not prove understanding.',credit:'Wild Frame · 2026-10-06 · Interactive miniature, awaiting independent review. Extends The Missing Year with naming branches and a persistent evidence boundary.',source:'Archived comparison of two tables',back:'Study notes'},ko:{title:'빛이 닿는 범위',intro:'등불은 두 표를 비출 뿐, 역사 전체를 비추지 않는다. 빈칸에 이름을 붙이고 그 이름이 무엇을 약속하는지 살펴보자.',scope:'근거 범위는 변하지 않는다. 크로노메트라가 선택한 두 기록 표만 대상이다. 2009년의 부재는 0도, 모든 기록에 없다는 증거도 아니다.',stageText:'여기에 없는 것은 한 해가 아니라 관측이다.',zero:'빈칸을 ‘0’이라 부르기',unknown:'빈칸을 ‘미상’이라 부르기',reset:'이름 거두기',start:'이름을 선택하자. 언어 전환은 서술을 바꿀 뿐 자료를 보충하지 않는다.',z:'‘0’은 수량에 대한 주장이다. 등불은 2009년 관측을 찾지 못했으므로 자료가 이 주장을 뒷받침하지 않는다. 빈칸이 0이 된 것은 아니다.',u:'‘미상’은 공백을 보존하지만 범위가 필요하다. 선택한 두 표에 관측이 없다는 뜻이지 역사 전체를 알 수 없다는 뜻이 아니다.',limits:'빛·글자·색은 수치나 확신도를 나타내지 않는다. 클릭은 기록을 바꾸지 않는다. 선택 수집·채점·소리 없음. 실제 독자 연구는 아직 없으며 조작 시험은 이해 증거가 아니다.',credit:'와일드 프레임 · 2026-10-06 · 독립 검토 대기인 상호작용 소품. 이전 작품에 명명 분기와 지속 표시되는 근거 범위를 추가했다.',source:'두 표의 기록 비교',back:'작품 설명'}};
let lang=new URLSearchParams(location.search).get('lang')||'zh',choice='start';if(!L[lang])lang='zh';function render(){document.documentElement.lang=lang;for(const k of ['title','intro','scope','stageText','zero','unknown','reset','limits','credit','source','back'])document.getElementById(k).textContent=L[lang][k];document.getElementById('note').textContent=L[lang][choice];document.getElementById('stage').dataset.open=choice!=='start';for(const [id,key]of [['zero','z'],['unknown','u']])document.getElementById(id).setAttribute('aria-pressed',choice===key);document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===lang));document.getElementById('back').href='../research-note.html?id=runo&date=2026-10-06&lang='+lang;}
document.getElementById('zero').onclick=()=>{choice='z';render()};document.getElementById('unknown').onclick=()=>{choice='u';render()};document.getElementById('reset').onclick=()=>{choice='start';render()};document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;render()});render();
</script></html>
