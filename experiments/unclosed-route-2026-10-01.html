<script>
const copy={zh:{byline:'逸帧 / 2026-10-01 / 可运行作品，待独立复核',title:'尚未抵达的线',intro:'1665年10月17日的日记记录了一次转运安排。把一条线画完，不代表任何人已经抵达。',map:'非地理比例的象征路线：Gravesend、Chatham、Maidstone与未确认抵达的Leeds Castle。',barrier:'缺少抵达记录',slider:'沿记载移动光点',motion:'光点为艺术隐喻，不代表实际行程、人数、距离或速度。终点不会因拖动而被确认。',record:'记录',interpretation:'解释',gap:'缺口',reset:'重新开始',recordHead:'被安排的路线',recordBody:'Evelyn记载：前往Gravesend，次日到Chatham，再到Maidstone，安排500名囚犯转往租用的Leeds Castle。地方人士请求不要在Maidstone安置病者，Edward Brett提供骑兵后卫。这是编本中官员的记述，不是囚犯的直接证词。',interpretationHead:'谁能拒绝停留？',interpretationBody:'地方接纳分歧令转运不只是地理移动。此处的阻隔是作品对记录缺口的解释，不表示史料记载了一堵墙或实际拦截。',gapHead:'线抵达，证据没有抵达',gapBody:'本次没有接收清单、给养签收或囚犯证词。日记中的500不能自动转成实际抵达人数。拖动到最右侧，仍停留在未确认状态。',boundary:'所有文字为当代释义或明确标记的解释；没有真实读者研究，不声称理解效果改善。无数据采集。',source:'原始日记电子编本：1665年10月17日',back:'返回研究工作台'},en:{byline:'Wild Frame / 2026-10-01 / Runnable artwork, awaiting review',title:'A line that has not arrived',intro:'The entry for 17 October 1665 records arrangements for movement. Completing a line does not establish anyone’s arrival.',map:'Symbolic, non-geographic route through Gravesend, Chatham and Maidstone to an unconfirmed arrival at Leeds Castle.',barrier:'Arrival record missing',slider:'Move a light along the account',motion:'The light is an artistic metaphor, not a record of travel, people, distance or speed. Dragging cannot confirm arrival.',record:'Record',interpretation:'Interpretation',gap:'Gap',reset:'Reset',recordHead:'An arranged route',recordBody:'Evelyn describes going to Gravesend, then Chatham the next day, and Maidstone, arranging the movement of 500 prisoners to rented Leeds Castle. Local figures asked him not to quarter sick people at Maidstone; Edward Brett provided horse for the rear. This is an official’s edited diary, not direct prisoner testimony.',interpretationHead:'Who can refuse a stay?',interpretationBody:'Local resistance to quartering makes this more than geography. The barrier is the artwork’s interpretation of missing evidence, not a historical wall or a documented interception.',gapHead:'The line arrives; the evidence does not',gapBody:'No reception list, provision receipt or prisoner testimony was obtained here. The recorded 500 cannot automatically become a count of arrivals. Even at the rightmost slider position, arrival remains unconfirmed.',boundary:'Contemporary paraphrases and labelled interpretation only. No real reader study or claim of improved understanding. No data collection.',source:'Diary edition: 17 October 1665',back:'Back to research'},ko:{byline:'와일드 프레임 / 2026-10-01 / 실행 작품, 독립 검토 대기',title:'아직 도착하지 않은 선',intro:'1665년10월17일 일기는 이송 준비를 기록한다. 선을 완성한다고 누군가의 도착이 입증되지는 않는다.',map:'Gravesend·Chatham·Maidstone에서 도착 미확인 Leeds Castle로 향하는 비지리적 상징 경로.',barrier:'도착 기록 없음',slider:'기록을 따라 빛 이동',motion:'빛은 예술적 은유이며 실제 여정·인원·거리·속도 자료가 아니다. 드래그로 도착을 확인할 수 없다.',record:'기록',interpretation:'해석',gap:'공백',reset:'다시 시작',recordHead:'준비된 경로',recordBody:'Evelyn은 Gravesend, 다음 날 Chatham, 이어 Maidstone을 방문하며 수감자500명을 임대한 Leeds Castle로 옮기려 했다고 적었다. 지역 인사들은 병자를 Maidstone에 묵게 하지 말라고 요청했고 Edward Brett는 후위 기병을 제공했다. 편집본 속 관리의 기록이지 수감자의 직접 증언은 아니다.',interpretationHead:'누가 체류를 거부할 수 있는가?',interpretationBody:'지역의 수용 반대는 이동을 지리 이상의 문제로 만든다. 이 장벽은 증거 공백에 대한 작품의 해석이며 실제 벽이나 차단이 있었다는 뜻은 아니다.',gapHead:'선은 도착해도 근거는 미도착',gapBody:'이번에 접수 명부·급식 수령증·수감자 증언은 확보하지 못했다. 기록의500명을 실제 도착 인원으로 간주할 수 없다. 슬라이더 끝에서도 도착은 미확인이다.',boundary:'현대적 요약과 표시된 해석만 사용. 실제 독자 연구·이해 개선 주장 없음. 데이터 수집 없음.',source:'일기 전자 편집본:1665년10월17일',back:'연구로 돌아가기'}};
let lang=new URLSearchParams(location.search).get('lang');if(!copy[lang])lang='zh';let mode='record';
function render(){const c=copy[lang];document.documentElement.lang=lang;for(const id of ['byline','title','intro','motionNote','boundary','source','back'])document.getElementById(id).textContent=c[id==='motionNote'?'motion':id];document.getElementById('mapTitle').textContent=c.map;document.getElementById('barrierLabel').textContent=c.barrier;document.getElementById('sliderLabel').textContent=c.slider;document.getElementById('reset').textContent=c.reset;document.getElementById('back').href='../research.html?lang='+lang;document.getElementById('heading').textContent=c[mode+'Head'];document.getElementById('body').textContent=c[mode+'Body'];document.querySelectorAll('[data-mode]').forEach(b=>{b.textContent=c[b.dataset.mode];b.setAttribute('aria-pressed',b.dataset.mode===mode)});document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===lang));document.querySelector('.route').style.opacity=mode==='gap'?'.25':'1'}
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;render()});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;render()});document.getElementById('distance').oninput=e=>document.getElementById('traveller').setAttribute('cx',70+6.8*Number(e.target.value));document.getElementById('reset').onclick=()=>{mode='record';document.getElementById('distance').value=0;document.getElementById('traveller').setAttribute('cx',70);render()};render();
</script></html>
